[project]
name = "onnx-resnet18-experiment"
version = "0.1.0"
description = "ONNX Runtime quick experiment with ResNet18"
requires-python = ">=3.12"
dependencies = [
    "torch==2.14.1",
    "torchvision==0.29.1",
    "onnx==1.23.1",
    "onnxruntime==1.30.0",
    "onnxscript==0.7.2",
]

# Resolve torch/torchvision from the official CPU-only wheel index.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
